<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>회원 · 납부 · 발송 — 사회혁신교육원사회적협동조합</title>
<style>
/* 통합관리자 「회원 · 납부 · 발송」 — 2026-11-18. 모양은 통합사이트 개편 시안 2판 화면 E 를 따른다.
   숫자·요금·계좌는 화면에 박아 두지 않고 /api/admin/membership/* 응답으로만 그린다. */
:root{--bg:#f5f1e6;--bg2:#e6e1d3;--card:#fff;--ink:#1e2b1c;--ink2:#3d5238;--mute:#667a61;--g9:#0d3b2c;--g7:#2c5842;--g6:#4a6741;--g1:#dbe4d0;--g0:#edf2e5;--gold:#8f6208;--gold1:#f6eac9;--line:rgba(60,80,50,.22);--danger:#a83232;--danger1:#f7e3e0;--r:14px;--font:'Pretendard Variable',Pretendard,'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR','NanumBarunGothic','NanumGothic',sans-serif;--serif:Georgia,'Noto Serif KR','Nanum Myeongjo',serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.6;overflow-x:hidden}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--g7)}
:focus-visible{outline:3px solid #d99a1c;outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:40px;height:40px;border-radius:50%;background:var(--g7);color:#faf6ec;font-family:var(--serif);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.7rem;white-space:nowrap;letter-spacing:-.03em;flex:none}
.brand b{display:block;font-family:var(--serif);font-size:1.15rem;color:var(--g9);line-height:1.2}
.brand span{font-size:.8rem;color:var(--mute);overflow-wrap:anywhere}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:.95rem;color:var(--ink);text-decoration:none;min-height:40px}
.btn:hover{background:var(--g0)}
.btn.p{background:var(--g7);color:#fff;border-color:var(--g7)}.btn.p:hover{background:var(--g9)}
.btn.gold{background:var(--gold1);border-color:#e3cd92;color:#5c3f05}
.btn.dg{color:var(--danger);border-color:#e0b4ae}
.btn.w{background:#fff;color:var(--g9);border-color:#fff}
.btn.sm{padding:4px 12px;font-size:.875rem;min-height:34px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--g0);border:1px solid var(--g1);border-radius:999px;padding:3px 11px;font-size:.875rem;white-space:nowrap;max-width:100%}
.chip.gold{background:var(--gold1);border-color:#e3cd92;color:#5c3f05}
.chip.x{background:#ebebe6;border-color:#d8d8d0;color:#55604f}
button.chip{min-height:32px}
.chip i.d{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.sec{padding:26px 0 0}
.sec h1{font-family:var(--serif);font-size:1.5rem;color:var(--g9);margin-bottom:4px}
.lead{color:var(--ink2)}
.note{font-size:.875rem;color:var(--mute)}
.err{background:var(--danger1);color:var(--danger);border-radius:8px;padding:8px 12px;font-size:.95rem;margin-top:12px}
.okb{background:#dcebd6;color:#1f5a2e;border-radius:8px;padding:8px 12px;font-size:.95rem;margin-top:12px}
.warn{background:var(--gold1);color:#5c3f05;border:1px solid #e3cd92;border-radius:10px;padding:10px 14px;font-size:.95rem}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
thead th{background:var(--g0);color:var(--g9);font-weight:700;white-space:nowrap}
tbody th{font-weight:700}
td.c,th.c{text-align:center}td.r,th.r{text-align:right;white-space:nowrap}
td.nw,th.nw{white-space:nowrap}
td.brk{overflow-wrap:anywhere;font-size:.84rem;min-width:190px}
td small,th small{display:block;color:var(--mute);font-weight:400;font-size:.8rem;overflow-wrap:anywhere}
.ckc{width:38px;text-align:center}
.ckc input,.pickall input{width:20px;height:20px;accent-color:var(--g7)}
.st{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.85rem;font-weight:600;white-space:nowrap}
.st.ok{background:#dcebd6;color:#1f5a2e}.st.no{background:var(--danger1);color:var(--danger)}.st.free{background:#ebebe6;color:#55604f}.st.wait{background:var(--gold1);color:#5c3f05}.st.tr{background:#e0f1e5;color:#256b42}
.kp{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.kp .chip b{color:var(--g9)}
.dist{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:4px 0 12px;background:#e9ece4}
.dist i{display:block;height:100%}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.tile{border:1px solid var(--line);border-left:6px solid var(--pc,var(--g6));border-radius:12px;padding:12px 14px;background:#fbfaf5;min-width:0}
.tile .k{font-size:.85rem;color:var(--mute)}.tile .v{font-size:1.15rem;font-weight:700;color:var(--g9);overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--mute);font-weight:600;white-space:nowrap;min-height:42px}
.tabs button[aria-selected=true]{color:var(--g9);border-bottom-color:var(--g7)}
.tabs button b{background:var(--gold1);color:#5c3f05;border-radius:99px;padding:0 7px;font-size:.8rem;margin-left:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools select,.tools input[type=search],.tools input[type=date],.inp{border:1px solid #b9c4b3;border-radius:10px;padding:8px 10px;min-height:42px;background:#fff;max-width:100%}
.tools input[type=search]{flex:1;min-width:160px}
.pickall{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;min-height:42px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.card h2{font-size:1.05rem;color:var(--g9);margin-bottom:6px}
.apply{background:var(--gold1);border:2px solid #e3cd92;border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.apply h2{font-size:1.05rem;color:#5c3f05;margin-bottom:8px}
.apply ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.apply li{background:#fff;border:1px solid #e3cd92;border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.apply li .who{flex:1;min-width:180px}
.apply li .who small{display:block;color:var(--mute);overflow-wrap:anywhere}
.ph{border:2px dashed #b9c4b3;border-radius:12px;padding:40px 16px;text-align:center;color:var(--mute);background:#fbfaf5}
.gate{max-width:560px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px 24px;text-align:center}
.gate h1{font-family:var(--serif);font-size:1.3rem;color:var(--g9);margin-bottom:8px}
.gate .acts{justify-content:center}
.acts{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:16px;align-items:center}
.selbar{position:fixed;left:0;right:0;bottom:0;background:var(--g9);color:#fff;z-index:40;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
.selbar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.selbar .btn{border-color:transparent}
.modal{position:fixed;inset:0;background:rgba(20,30,20,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}
.modal .box{background:#fff;border-radius:var(--r);width:100%;max-width:640px;padding:20px 22px}
.modal .box.sm{max-width:440px}
.modal h2{font-size:1.2rem;color:var(--g9);font-family:var(--serif)}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.f{display:grid;gap:4px;margin-bottom:12px}
.f label,.f .lb{font-weight:600;font-size:.95rem;color:var(--ink2)}
.f input[type=text],.f input[type=date],.f textarea{width:100%;border:1px solid #b9c4b3;border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
.f textarea{min-height:150px;resize:vertical}
.req{color:var(--danger)}
.rcp{display:flex;flex-wrap:wrap;gap:5px;max-height:104px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fbfaf5}
.rcp .chip{white-space:normal;overflow-wrap:anywhere}
.pvw{background:#fbfaf5;border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:40vh;overflow:auto}
.kv{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.kv li{display:flex;gap:10px;justify-content:space-between}
.kv li span{color:var(--mute)}
.kv li b{text-align:right;overflow-wrap:anywhere}
.ck{display:flex;gap:8px;align-items:flex-start;margin-top:12px}
.ck input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--g7)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1e2b1c;color:#fff;border-radius:10px;padding:10px 18px;z-index:80;max-width:calc(100vw - 32px);text-align:center}
.res{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.linkb{background:none;border:0;padding:0;color:var(--g7);text-decoration:underline;text-underline-offset:3px;font-weight:600;text-align:left}
@media(max-width:900px){
  .pays{grid-template-columns:1fr}
}
@media(max-width:760px){
  .brand span{display:none}.brand b{font-size:1rem}.brand .mark{width:34px;height:34px}
  .sec h1{font-size:1.3rem}
  .rt{border:0;background:none;overflow:visible}
  .rt table,.rt tbody,.rt tr,.rt td,.rt th{display:block}
  .rt thead{position:absolute;left:-9999px}
  .rt tr{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:8px 12px;position:relative}
  .rt td,.rt tbody th{border:0;padding:3px 0;text-align:left!important;background:none;white-space:normal;overflow-wrap:anywhere;width:auto}
  .rt tbody th{padding-right:40px}
  .rt td[data-l]::before{content:attr(data-l) " · ";color:var(--mute);font-size:.85rem}
  .rt td.ckc{position:absolute;right:10px;top:8px;z-index:1}
  .rt td small{display:inline;margin-left:4px}
  .rt td.empty{text-align:center!important;color:var(--mute)}
  .modal .box{padding:16px 14px}
  .selbar .btn{flex:1;padding:8px 6px;font-size:.88rem;white-space:nowrap}
  .apply li .who{flex-basis:100%}
  .selbar .cnt{flex-basis:100%}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span class="mark" aria-hidden="true">사교원</span><div><b>회원 · 납부 · 발송</b><span>사회혁신교육원사회적협동조합 통합관리자</span></div></div>
  <span class="sp"></span>
  <span class="note" id="who"></span>
  <a class="btn sm" href="/">← 통합사이트</a>
  <a class="btn sm" href="/admin.html">관리</a>
</div></header>
<main id="view"><div class="wrap"><div class="gate"><p>불러오는 중입니다…</p></div></div></main>
<div id="selbar"></div>
<div id="layer"></div>
<div id="toastBox" aria-live="polite"></div>

<script>
'use strict';
/* 인증은 같은 출처 HttpOnly 쿠키(sk_session) — admin.html 과 같은 방식(/api/auth/me).
   서버 글·사용자 글은 반드시 esc() 를 거쳐 그린다. 서버 모듈 기준: membership.py(2026-11-18 2판). */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => Number(n || 0).toLocaleString('ko-KR') + '원';
const view = $('#view'), layer = $('#layer');

/* 한 번에 보낼 수 있는 인원 — 회원 목록 응답의 send_max 를 쓴다(응답에 없으면 100). 넘으면 서버도 too_many 로 거절한다. */
let SEND_MAX = 100;
const SMS_WAIT = '문자 발송은 아직 준비 중입니다(발송 대행 서비스 가입 뒤 열립니다)';
const TIER_COLOR = {admin:'#0d3b2c', staff:'#4a6741', federation:'#e8892b', coop:'#f6b52e', policy:'#1f3a6e', personal:'#2e7d4f', free:'#b9c4b3'};
const PAY_CLASS = {'완료':'ok', '미납':'no', '확인 대기':'wait', '승인 대기':'wait', '무료 시범':'tr'};
const SUB_KO = {apply:'승인 대기', wait_pay:'입금 대기', trial:'무료 시범', active:'이용 중', cancel:'그만둠(기간 남음)'};
const ERR_KO = {unauthorized:'로그인이 풀렸습니다. 다시 로그인해 주세요.', forbidden:'통합관리자만 할 수 있는 일입니다.',
  not_found:'대상을 찾지 못했습니다. 이미 처리됐을 수 있습니다 — 목록을 새로 고쳤습니다.', rate_limited:'요청이 너무 잦습니다. 잠시 뒤 다시 해 주세요.',
  bad_action:'할 수 없는 동작입니다.', bad_status:'볼 수 없는 목록입니다.'};

const S = {me:null, data:null, tab:'mem', picked:{}, f:{q:'', tier:'', svc:'', pay:''},
  rc:{status:'wait', full:false, rows:null, err:''}, inq:{rows:null, err:''}, bank:{busy:false, out:null, err:''}, log:{rows:null, job:null, err:''}, payDate:{}};
let C = null;      // 발송 작성 창 상태
let logTimer = 0;

async function api(path, opts = {}) {
  const init = {credentials:'same-origin', method: opts.method || 'GET', cache:'no-store'};
  if (opts.form) init.body = opts.form;
  else if (opts.body !== undefined) { init.headers = {'Content-Type':'application/json'}; init.body = JSON.stringify(opts.body); }
  let res;
  try { res = await fetch(path, init); } catch (e) { return {status:0, ok:false, data:{}}; }
  let data = {};
  if (!opts.blob) { try { data = await res.json(); } catch (e) { data = {}; } }
  return {status:res.status, ok:res.ok && data.ok !== false, data, res};
}
function why(r, fallback) {      // 서버 안내 글이 있으면 그것을, 없으면 오류 코드 풀이를
  if (r.status === 0) return '서버에 닿지 못했습니다. 연결을 확인하고 다시 해 주세요.';
  return (r.data && r.data.message) || ERR_KO[r.data && r.data.error] || fallback || ('처리하지 못했습니다(' + r.status + ').');
}
function toast(msg) { const b = $('#toastBox'); b.innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>'; clearTimeout(toast.t); toast.t = setTimeout(() => { b.innerHTML = ''; }, 4200); }
function todayKST() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
function gate(title, body, btns) { view.innerHTML = '<div class="wrap"><div class="gate" id="gate"><h1>' + esc(title) + '</h1><p>' + esc(body) + '</p>' + (btns ? '<div class="acts">' + btns + '</div>' : '') + '</div></div>'; $('#selbar').innerHTML = ''; }

/* ── 들어오기: 통합관리자(role admin)만 ── */
async function boot() {
  const r = await api('/api/auth/me');
  if (r.status === 0 || r.status >= 500) return gate('서버에 닿지 못했습니다', '잠시 뒤 다시 열어 주세요.', '<button type="button" class="btn p" id="retry">다시 시도</button>');
  const u = r.ok && r.data.user;
  if (!u) { gate('로그인이 필요합니다', '통합관리자 계정으로 로그인한 뒤 다시 열어 주세요. 곧 로그인 화면으로 갑니다.', '<a class="btn p" href="/#/login">로그인하러 가기</a>'); return leave(); }
  if (u.role !== 'admin') { gate('통합관리자만 볼 수 있는 화면입니다', '회원·납부·발송은 통합관리자 계정으로만 열립니다. 곧 로그인 화면으로 갑니다.', '<a class="btn p" href="/#/login">로그인 화면으로</a><a class="btn" href="/">통합사이트로</a>'); return leave(); }
  S.me = u; $('#who').textContent = (u.name || u.username || '') + ' 님';
  await load(true);
}
function leave() { setTimeout(() => { location.href = '/#/login'; }, 3500); }

async function load(first) {
  const r = await api('/api/admin/membership/members');
  if (r.status === 404) { S.data = null; return gate('회원·납부 기능은 준비 중입니다', '서버에 회원·납부 모듈이 아직 올라가지 않았습니다.', '<a class="btn" href="/">← 통합사이트</a><a class="btn" href="/admin.html">관리</a>'); }
  if (r.status === 401 || r.status === 403) return boot();
  if (!r.ok) { if (first || !S.data) gate('회원 목록을 불러오지 못했습니다', why(r), '<button type="button" class="btn p" id="retry">다시 시도</button>'); else toast(why(r)); return; }
  S.data = r.data;
  if (Number(r.data.send_max) > 0) SEND_MAX = Number(r.data.send_max);
  const have = {}; r.data.members.forEach(m => { have[m.id] = 1; });
  Object.keys(S.picked).forEach(id => { if (!have[id]) delete S.picked[id]; });      // 그 사이 사라진 회원은 고른 목록에서 뺀다
  render();
}

/* ── 그리기 ── */
function pickedList() { return S.data ? S.data.members.filter(m => S.picked[m.id]) : []; }
function svcNames() { const o = {}; S.data.members.forEach(m => m.services.forEach(x => { o[x.product] = x.name; })); return o; }
function nextDue(m) {       // 다음 납부일: 입금 대기는 유예 끝, 이용 중은 낸 기간 끝, 무료 시범은 청구가 시작되는 달
  const out = [];
  m.services.forEach(x => {
    if (x.status === 'wait_pay' && x.grace_until) out.push([x.grace_until, '까지 입금']);
    else if (x.status === 'active' && x.paid_until) out.push([x.paid_until, '까지 이용']);
    else if (x.status === 'trial') out.push([S.data.billing_from, '부터 청구']);
  });
  if (!out.length) return '-';
  out.sort((a, b) => a[0] < b[0] ? -1 : 1);
  return esc(out[0][0]) + ' <small>' + out[0][1] + '</small>';
}
function shown() {
  const f = S.f, q = f.q.trim().toLowerCase();
  return S.data.members.filter(m => {
    if (f.tier && m.tier !== f.tier) return false;
    if (f.pay && m.pay_status !== f.pay) return false;
    if (f.svc === '-' && m.services.length) return false;
    if (f.svc && f.svc !== '-' && !m.services.some(x => x.product === f.svc)) return false;
    if (q && [m.name, m.username, m.email, m.contact].join(' ').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function applies() { const a = []; S.data.members.forEach(m => m.services.forEach(x => { if (x.status === 'apply') a.push({m, x}); })); return a; }

function sendBody(preview) { return {channel:C.ch, ids:pickedList().map(m => m.id), subject:C.subj.trim(), body:C.body.trim(), preview:!!preview, notice:!!C.notice}; }
async function composePreview() {
  saveC();

  C.busy = true; C.err = ''; composeRender();
  const r = await api('/api/admin/membership/send', {method:'POST', body:sendBody(true)});
  if (!C) return;

async function composeSend() {
  if (C.busy) return;
  C.busy = true; C.err = ''; composeRender();
  const r = await api('/api/admin/membership/send', {method:'POST', body:sendBody(false)});
  if (!C) return;
  C.busy = false;
  if (r.ok && r.data.job) { C.done = {job:r.data.job, queued:r.data.queued, skipped:r.data.skipped || []}; C.step = 'done'; C.subj = ''; C.body = ''; S.log.rows = null; }

  composeRender();
}

async function bankGo() {
  const f = $('#bankFile'), B = S.bank;
  if (!f || !f.files || !f.files[0]) { B.err = '거래내역 파일을 먼저 골라 주세요.'; B.out = null; return render(); }
  const fd = new FormData(); fd.append('file', f.files[0]);
  B.busy = true; B.err = ''; B.out = null; render();
  const r = await api('/api/admin/membership/bank', {method:'POST', form:fd});
  B.busy = false;
  if (r.ok && Array.isArray(r.data.lines)) { B.out = r.data; if (r.data.confirmed) S.rc.rows = null; }
  else B.err = why(r, '파일을 읽지 못했습니다.');
  await load();
}
async function rcDone(id) {
  const x = (S.rc.rows || []).find(y => String(y.invoice) === String(id)); if (!x) return;
  const yes = await ask('발행한 것으로 표시할까요?', '<ul class="kv"><li><span>청구번호</span><b>#' + esc(x.invoice) + '</b></li><li><span>이름</span><b>' + esc(x.name) + '</b></li><li><span>합계</span><b>' + won(x.amount) + '</b></li><li><span>증빙</span><b>' + esc(x.kind) + '</b></li></ul><p class="note" style="margin-top:10px">홈택스 등에서 실제로 발행한 뒤 눌러 주세요. 화면에서 되돌리는 기능은 없습니다.</p>', '발행함');
  if (!yes) return;
  const r = await api('/api/admin/membership/receipts/' + encodeURIComponent(id) + '/done', {method:'POST', body:{}});
  toast(r.ok ? '청구 #' + id + ' 을(를) 「발행함」으로 표시했습니다' : (r.status === 200 ? '이미 처리된 건입니다. 목록을 새로 읽었습니다.' : why(r)));
  await loadRc(); await load();
}
async function rcCsv() {
  const yes = await ask('발행 대기 목록을 내려받을까요?', '<p>내려받는 파일에는 발행 번호(휴대폰·사업자등록번호) <b>전체</b>가 들어 있습니다. 내려받은 기록이 남습니다. 발행을 마치면 파일을 지워 주세요.</p>', '내려받기');
  if (!yes) return;
  const r = await api('/api/admin/membership/receipts/export', {blob:true});
  if (!r.res || !r.res.ok) return toast(r.status === 0 ? '서버에 닿지 못했습니다.' : '내려받지 못했습니다(' + r.status + ').');
  try {
    const b = await r.res.blob(), a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([b], {type:'text/csv'})); a.download = '현금영수증_발행대기_' + todayKST().replace(/-/g, '') + '.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast('발행 대기 목록을 내려받았습니다');
  } catch (e) { toast('이 브라우저에서는 내려받기를 할 수 없습니다'); }
}
async function rcFull() {
  const R = S.rc;
  if (!R.full) { const yes = await ask('발행 번호 전체를 볼까요?', '<p>휴대폰·사업자등록번호 전체가 화면에 보입니다. 열람 기록이 남습니다. 발행할 때만 열고, 마치면 「번호 가리기」를 눌러 주세요.</p>', '전체 보기'); if (!yes) return; }
  R.full = !R.full; await loadRc();
}
function setTab(t) {
  S.tab = t; clearTimeout(logTimer);
  if (t !== 'rc' && S.rc.full) { S.rc.full = false; S.rc.rows = null; }      // 다른 탭으로 가면 전체 번호는 화면에 남기지 않는다
  render(); window.scrollTo(0, 0);
  if (t === 'rc' && !S.rc.rows) loadRc();
  if (t === 'inq') loadInq();
  if (t === 'log') loadLog(S.log.job && S.log.job.state !== 'done' ? S.log.job.id : 0);
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('button,a,[data-close]'); if (!t) { if (ev.target.classList && ev.target.classList.contains('modal')) closeLayer(); return; }
  const d = t.dataset;
  if (t.id === 'retry') return boot();
  if (t.id === 'inqReload') return loadInq();
  if (d.close !== undefined) return closeLayer();
  if (d.tab) return setTab(d.tab);
  if (t.id === 'reload') return load().then(() => toast('새로 읽었습니다'));
  if (d.approve) return subAct(+d.approve, 'approve');
  if (d.reject) return subAct(+d.reject, 'reject');
  if (d.compose) return openCompose(d.compose);
  if (t.id === 'pickClear') { S.picked = {}; memRows(); selbar(); return; }
  if (d.ch) { saveC(); C.ch = d.ch; C.step = 'write'; C.err = ''; C.pv = null; return composeRender(); }
  if (t.id === 'cPrev') return composePreview();
  if (t.id === 'cBack') { C.step = 'write'; C.err = ''; return composeRender(); }
  if (t.id === 'cSend') return composeSend();
  if (t.id === 'cLog') { const j = C.done.job; C = null; layer.innerHTML = ''; S.tab = 'log'; S.log.job = null; render(); return loadLog(j); }
  if (d.paid) return invoicePaid(+d.paid);
  if (t.id === 'bankGo') return bankGo();
  if (d.rc) { S.rc.status = d.rc; return loadRc(); }
  if (t.id === 'rcFull') return rcFull();
  if (t.id === 'rcCsv') return rcCsv();
  if (d.rcdone) return rcDone(d.rcdone);
  if (d.job) return loadLog(+d.job);
  if (t.id === 'logBack') return loadLog(0);
});
document.addEventListener('change', ev => {
  const t = ev.target, d = t.dataset || {};
  if (d.pick) { if (t.checked) S.picked[d.pick] = 1; else delete S.picked[d.pick]; memRows(); selbar(); return; }
  if (t.id === 'pickAll') { shown().forEach(m => { if (t.checked) S.picked[m.id] = 1; else delete S.picked[m.id]; }); memRows(); selbar(); return; }
  if (t.id === 'fTier') { S.f.tier = t.value; return memRows(); }
  if (t.id === 'fSvc') { S.f.svc = t.value; return memRows(); }
  if (t.id === 'fPay') { S.f.pay = t.value; return memRows(); }
  if (d.paydate) { S.payDate[d.paydate] = t.value; return; }
  if (t.id === 'cNotice') { C.notice = t.checked; const b = $('#cSend'); if (b) b.disabled = !C.notice || !C.pv.to.length; return; }
});
document.addEventListener('input', ev => { if (ev.target.id === 'fq') { S.f.q = ev.target.value; memRows(); } });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && layer.innerHTML) closeLayer(); });
window.addEventListener('resize', () => { if (S.data) selbar(); });

boot();
</script>
</body>
</html>
